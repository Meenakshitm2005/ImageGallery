<html lang="en">

```

</head>
<body>

```
<div class="container">

    <h1>The Curated Canvas</h1>

    <p id="quote">
        "Art enables us to find ourselves and lose ourselves at the same time."
    </p>

    <div class="gallery-card">

        <div class="full-img">

            <img
                class="displayed-img"
                src="images/pic1.jpg"
                alt="Artwork">

            <div class="overlay"></div>

            <button class="dark">
                Gallery Lighting
            </button>

        </div>

        <div class="thumb-bar"></div>

    </div>

    <div class="ticket-section">

        <h2>Visit The Gallery</h2>

        <form id="ticketForm">

            <input
                type="text"
                placeholder="Your Name"
                required>

            <input
                type="email"
                placeholder="Email Address"
                required>

            <input
                type="number"
                placeholder="Number of Tickets"
                min="1"
                required>

            <input
                type="date"
                required>

            <button
                type="submit"
                class="reserve-btn">
                Reserve Ticket
            </button>

        </form>

        <p id="message"></p>

    </div>

    <footer>
        Curated with passion for timeless art © 2025
    </footer>

</div>

<script src="main.js"></script>
```

</body>
</html>
